<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>QA fixture — widget inside a host page</title>
<style>html,body{margin:0;background:#fff}iframe{display:block;width:100%;border:0;height:900px}</style>
</head>
<body>
<div id="host">
  <iframe id="f" src="../embed/" title="widget under test"></iframe>
</div>
<script>
/* Minimal host: records every message and applies the resize protocol.
   This is exactly what Optimizely has to do (see docs/INTERFACE.md). */
window.__msgs = [];
window.addEventListener("message", function (e) {
  var d = e.data;
  if (!d || typeof d !== "object" || d.source !== "fhf-taxcalc") return;
  window.__msgs.push(d);
  if (d.type === "resize" && document.getElementById("f").contentWindow === e.source) {
    document.getElementById("f").style.height = d.height + "px";
  }
});
</script>
</body>
</html>
