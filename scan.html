<!DOCTYPE html>
<html lang="zh-Hant-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>POC — 二維碼掃描成功</title>
<link rel="icon" href="data:,">
<style>
:root{--orange:#e97824;--ink:#282828;--muted:#666;--line:#e8e8f2;
  --sans:system-ui,-apple-system,"PingFang HK","Noto Sans HK","Microsoft JhengHei",Helvetica,Arial,sans-serif}
body{margin:0;font-family:var(--sans);color:var(--ink);background:#F6F6FD;display:grid;place-items:center;min-height:100vh;padding:24px}
.card{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:520px;padding:28px;text-align:center}
.tick{width:56px;height:56px;border-radius:50%;background:#eef8f2;border:1px solid #cfe3d7;color:#1a6b3c;display:grid;place-items:center;font-size:26px;margin:0 auto 16px}
h1{font-size:1.25rem;margin:0 0 8px}
p{color:var(--muted);font-size:.95rem;margin:0 0 12px;line-height:1.6}
.rail{display:inline-block;font-weight:650;color:var(--ink);background:#fdf6ee;border:1px solid #f0dcc4;border-radius:999px;padding:4px 14px;font-size:.9rem;margin-bottom:14px}
a{display:inline-block;margin-top:8px;color:#01014E;font-size:.9rem;text-underline-offset:3px}
code{font-family:ui-monospace,Menlo,monospace;font-size:.85em;background:#f7f8fa;padding:1px 5px;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <div class="tick">✓</div>
  <div class="rail" id="rail">—</div>
  <h1>二維碼掃描成功</h1>
  <p>呢個係 POC 測試碼。掃到呢一頁，證明二維碼可以正常掃描、亦可以帶您去指定頁面。</p>
  <p>正式上線時，呢個位置會換成客戶提供嘅<strong>商戶收款二維碼</strong>（靜態碼，金額由捐款人喺付款 App 內自行輸入）。</p>
  <p style="font-size:.82rem">測試參數：<code id="qs">—</code></p>
  <a href="./embed/">← 返回計算機 POC</a>
</div>
<script>
var p = new URLSearchParams(location.search);
var r = p.get("rail");
document.getElementById("rail").textContent = r === "payme" ? "PayMe 測試碼" : r === "alipay" ? "AlipayHK 測試碼" : "測試碼";
document.getElementById("qs").textContent = location.search || "(none)";
</script>
</body>
</html>
